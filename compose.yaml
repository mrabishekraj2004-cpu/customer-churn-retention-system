services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: customer-churn-api:1.0.0
    container_name: customer-churn-api

    ports:
      - "8000:8000"

    environment:
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      DATABASE_URL: sqlite:////app/data/customer_churn.db
      MODEL_PATH: /app/models/churn_pipeline.joblib
      MODEL_METADATA_PATH: /app/models/churn_pipeline_metadata.json
      LOG_LEVEL: INFO

    volumes:
      - customer_churn_data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  customer_churn_data:
    name: customer-churn-data
